name: tests
on: [push]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make the sample folder
        run: python make_sample.py
      - name: Run the tests
        run: python -m unittest -v
      - name: Check the sample counts
        shell: bash
        run: |
          python count_lines.py sample
          python count_lines.py sample | grep -q "5 files counted: 24 lines in total, 3 blank." && echo "Sample line counts checked."
